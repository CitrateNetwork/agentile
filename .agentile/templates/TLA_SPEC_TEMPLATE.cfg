\*
\* TLA+ CONFIG TEMPLATE — Agentile.
\*
\* Companion to TLA_SPEC_TEMPLATE.tla. TLC reads this file to know
\* which spec to check, which constants to bind, and which
\* invariants to prove. Rename to <YourSpecName>.cfg.
\*
\* Keep state-space bounds (MaxSteps, set sizes) small enough that
\* TLC finishes in seconds-to-minutes during local development.
\* The .cfg is the place to scale them up for CI / deep verification.

SPECIFICATION Spec

\* Bind every CONSTANT declared in the .tla.
\* Sets: list elements in {}.
\* Functions: use the spec's *Impl name (defined as a value in the .tla)
\* or inline a function literal here.
CONSTANTS
    Actor = {"a1", "a2", "a3"}
    MaxSteps = 8

\* Invariants to check on every reachable state. Each name MUST be
\* defined in the .tla file. TLC reports the first violation it
\* encounters with a counterexample trace.
INVARIANTS
    TypeOK
    SafetyExample

\* Optional: a temporal property (use PROPERTY, not INVARIANT).
\* PROPERTY
\*     Liveness

\* Optional: explicit symmetry to shrink the state space.
\* SYMMETRY Permutations(Actor)

\* Optional: cap state-space exploration depth (in addition to MaxSteps).
\* CONSTRAINT stepCount <= 10
