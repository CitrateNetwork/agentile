name: Lint Frontmatter

# Rule 12 enforcer — fires on every PR. Runs `check_frontmatter.py`
# scoped to the .md files the PR actually changed under .agentile/.
#
# Why scoped: a fresh project's first few sprints will accumulate a
# lot of valid pre-rule artifacts that don't have frontmatter; the
# ratchet (ratchet 4) gates the project-wide fraction. This workflow
# enforces that NEW docs added in a PR all have frontmatter, which is
# the strict subset that should never regress.

on:
  pull_request:
    paths:
      - '.agentile/**/*.md'
      - 'scripts/ci/check_frontmatter.py'
      - '.github/workflows/lint-frontmatter.yml'
  push:
    branches: [main]
    paths:
      - '.agentile/**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-frontmatter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Frontmatter required (Rule 12)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Determine changed .md files under .agentile/
        id: changed
        # SECURITY: SHAs come through `env:` (not `${{ }}` in the script body),
        # and the changed-file list is written to a workspace FILE, never to a
        # step output that later gets interpolated into a `run:` shell. A PR
        # can add a file whose name contains shell metacharacters (`;`, `$( )`,
        # backticks); interpolating that name into `run:` is command injection.
        # Passing it via a file + `--files-from` removes the expansion entirely.
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"; head="$PR_HEAD_SHA"
          else
            base="$PUSH_BEFORE_SHA"; head="$PUSH_HEAD_SHA"
          fi
          # Filter to .md files under .agentile/, excluding INDEX/.
          git diff --name-only --diff-filter=AM "$base" "$head" -- '.agentile/**/*.md' \
            | grep -v '^\.agentile/INDEX/' > changed_files.txt || true
          if [[ -s changed_files.txt ]]; then
            echo "any=true" >> "$GITHUB_OUTPUT"
          else
            echo "any=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check frontmatter on changed files
        if: ${{ steps.changed.outputs.any == 'true' }}
        run: ./scripts/ci/check_frontmatter.py --files-from changed_files.txt

      - name: No relevant changes
        if: ${{ steps.changed.outputs.any == 'false' }}
        run: echo "No .md changes under .agentile/ in this PR; nothing to check."
